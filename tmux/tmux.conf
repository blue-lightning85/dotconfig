# Desktop:
# - Configuration file for tmux

run '~/.config/tmux/plugins/tpm/tpm'

set-option -sa terminal-overrides ",xterm*:Tc"

# set-option -g destroy-unattached on

set -g default-terminal "screen-256color"

set -g mouse on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding
set -g @vim_navigator_prefix_mapping_clear_screen ""

# Theme
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark' # or 'light'
set-option -g status-position top

# Key bindings
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -n M-h previous-window
bind -n M-l next-window

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

bind C command-prompt -p "Name of new window: " "new-window -n '%%'"

bind '#' command-prompt -p "Name for this new window: " "rename-window '%%'"
bind '@' set-option automatic-rename on
